<!DOCTYPE HTML>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prehľad Obedov</title>

    <link rel="icon" href="favicon.ico">

    <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    <script src="js/script.js" defer></script>
</head>

<body>
    <header>
        <img src="../images/logo.svg" 
            alt="Header logo showing dining plate, a fork and a knife"
            width="90px" height="90px">
        <div class="header-text">
            <h1>Obedár FEI</h1>
            <p>Prehľad obedových menu v okolí FEI STU</p>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="index.html" class="active">Obedové menu</a></li>
            <li><a href="pages/about.html">O projekte</a></li>
        </ul>
    </nav>

    <main>
        <div class="page-intro">
            <h2>Čo je dnes na obed?</h2>
            <p>
                Vyberte si deň a prezrite si obedové menu reštaurácií
                v okolí FEI STU. 
            </p>
        </div>

        <section id="day-selection">
            <h2>Vyberte deň</h2>

            <div class="day-buttons">
                <button type="button" data-day="1" class="active">Pondelok</button>
                <button type="button" data-day="2">Utorok</button>
                <button type="button" data-day="3">Streda</button>
                <button type="button" data-day="4">Štvrtok</button>
                <button type="button" data-day="5">Piatok</button>
                <button type="button" data-day="all">Celý týždeň</button>
            </div>
        </section>

        <section class="filters">
            <h2>Reštaurácie</h2>

            <div id="restaurant-filters" class="restaurant-filters" aria-label="Filter reštaurácií"></div>

            <div class="action-buttons">
                <button type="button" id="refresh-menu" disabled title="Dostupné po pripojení reálnych zdrojov">Aktualizovať menu</button>
                <button type="button" id="clear-cache" disabled title="Dostupné po pripojení ukladania dát">Vymazať dáta</button>
            </div>
        </section>

        <section id="menus" class="menu-results" aria-live="polite">
            <div class="menu-heading">
                <h2 id="menu-title">Obedové menu</h2>
                <span class="demo-label">Ukážkové údaje</span>
            </div>
            <div id="restaurant-container" class="row g-3"></div>
        </section>
    </main>

    <footer>
        Použité knižnice: Bootstrap 5 a jQuery.
    </footer>
</body>

</html>
