<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Z čoho sa skladá bicykel</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>Z čoho sa skladá bicykel</h1>

    <figure class="hotspot-image">
      <img src="img/my_image.jpg" alt="Ilustrácia bicykla z pravého boku" width="1000" height="600">

      <div class="hotspot hotspot--left" style="--x: 60%; --y: 55.5%">
        <button class="hotspot__dot" type="button" aria-label="Stan"></button>
        <div class="hotspot__panel">
          <h2>Stan</h2>
          <p>Stan na spánok počas cesty</p>
        </div>
      </div>

      <div class="hotspot hotspot--left" style="--x: 63%; --y: 66.75%">
        <button class="hotspot__dot" type="button" aria-label="Brašne"></button>
        <div class="hotspot__panel">
          <h2>Brašne</h2>
          <p>Počas dlhšej cesty je potrebné mať dostatočne veľké úložisko na batožinu.</p>
        </div>
      </div>

      <div class="hotspot" style="--x: 32%; --y: 68.75%">
        <button class="hotspot__dot" type="button" aria-label="Fľaše"></button>
        <div class="hotspot__panel">
          <h2>Dodatočné fľaše</h2>
          <p>Sú potrebné pri prechode cez miesta, kde nemusia byť blízko dostupné obchody.</p>
        </div>
      </div>
    </figure>

    <p>Text pod obrázkom, aby bolo vidieť, čo sa deje s obsahom pod ním.</p>
  </main>
</body>
</html>
